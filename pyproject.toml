[project]
name = "recall"
version = "0.1.0"
description = "Text it anything. It remembers, organizes it, and reminds you before you forget."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "fastembed>=0.9.1",
    "langchain-core>=1.7.3",
    "langgraph>=1.2.19",
    "python-dotenv>=1.0",
    "python-telegram-bot[job-queue]>=21.6",
    "sqlite-vec>=0.1.6",
    "tzdata>=2024.1",
]

[project.scripts]
recall = "recall.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
